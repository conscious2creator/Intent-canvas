<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intent Canvas — Beta</title>
<style>body{margin:0;background:#171b20;color:white;font:15px system-ui}header,nav,section{padding:12px}nav{display:flex;flex-wrap:wrap;gap:8px}button,label{background:#343e45;color:white;border:1px solid #667780;border-radius:8px;padding:9px;cursor:pointer}button.active{background:#087c78}#area{position:relative;background:white;height:60vh;min-height:300px;margin:10px;border-radius:8px;overflow:hidden;touch-action:none}canvas{position:absolute;width:100%;height:100%;touch-action:none}textarea{width:96%;height:75px;background:#262d33;color:white}input[type=file]{display:none}</style>
<header><strong>Intent Canvas · Beta Preview</strong><p>Illustrative Illusions LLC · Created by Andy Smith</p></header>
<nav><label>Load image<input id="upload" type="file" accept="image/*"></label><button id="pen" class="active">Pen</button><button id="erase">Eraser</button><input id="color" type="color" value="#f33b37"><input id="size" type="range" min="1" max="30" value="5"><button id="undo">Undo</button><button id="clear">Clear</button><button id="export">Export PNG</button><button id="json">Export JSON</button><button id="copy">Copy prompt</button></nav>
<div id="area"><canvas id="base"></canvas><canvas id="ink"></canvas></div><section><textarea id="intent" placeholder="Describe what your marks mean..."></textarea><p>Browser-only beta preview. Images stay on your device. Apple Pencil and Safari testing pending.</p></section>
<script>
const area=document.querySelector('#area'),base=document.querySelector('#base'),ink=document.querySelector('#ink'),b=base.getContext('2d'),d=ink.getContext('2d');let strokes=[],current=null,mode='pen',photo=null;
function resize(){for(let c of [base,ink]){c.width=area.clientWidth*devicePixelRatio;c.height=area.clientHeight*devicePixelRatio;c.getContext('2d').setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}render()}addEventListener('resize',resize);
function draw(s){if(!s)return;d.save();if(s.mode==='erase')d.globalCompositeOperation='destination-out';d.strokeStyle=s.color;d.lineWidth=s.size;d.lineCap='round';d.lineJoin='round';d.beginPath();s.points.forEach((p,i)=>{const x=p[0]*area.clientWidth,y=p[1]*area.clientHeight;i?d.lineTo(x,y):d.moveTo(x,y)});if(s.points.length===1){let p=s.points[0];d.lineTo(p[0]*area.clientWidth+.1,p[1]*area.clientHeight+.1)}d.stroke();d.restore()}
function render(){b.fillStyle='white';b.fillRect(0,0,area.clientWidth,area.clientHeight);if(photo){let k=Math.min(area.clientWidth/photo.width,area.clientHeight/photo.height),w=photo.width*k,h=photo.height*k;b.drawImage(photo,(area.clientWidth-w)/2,(area.clientHeight-h)/2,w,h)}d.clearRect(0,0,area.clientWidth,area.clientHeight);strokes.forEach(draw);draw(current)}
function point(e){let r=ink.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
ink.onpointerdown=e=>{e.preventDefault();ink.setPointerCapture(e.pointerId);current={mode,color:document.querySelector('#color').value,size:+document.querySelector('#size').value,points:[point(e)]};render()};
ink.onpointermove=e=>{if(!current)return;current.points.push(point(e));render()};function finish(){if(current){strokes.push(current);current=null;render()}}ink.onpointerup=finish;ink.onpointercancel=finish;
for(let id of ['pen','erase'])document.getElementById(id).onclick=()=>{mode=id;for(let t of ['pen','erase'])document.getElementById(t).classList.toggle('active',t===id)};
document.querySelector('#undo').onclick=()=>{strokes.pop();render()};document.querySelector('#clear').onclick=()=>{if(confirm('Clear annotations?')){strokes=[];render()}};
document.querySelector('#upload').onchange=e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{photo=im;render();URL.revokeObjectURL(url)};im.src=url};
function save(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.querySelector('#export').onclick=()=>{let c=document.createElement('canvas');c.width=base.width;c.height=base.height;let x=c.getContext('2d');x.drawImage(base,0,0);x.drawImage(ink,0,0);c.toBlob(blob=>save(blob,'intent-canvas.png'))};
document.querySelector('#json').onclick=()=>save(new Blob([JSON.stringify({schema:'intent-canvas/beta-preview',intent:document.querySelector('#intent').value,strokes,sourceImageIncluded:false},null,2)],{type:'application/json'}),'intent-canvas.json');
document.querySelector('#copy').onclick=async()=>{let t='Use my annotated image as compositional guidance, not finished art. Intent: '+document.querySelector('#intent').value;try{await navigator.clipboard.writeText(t);alert('Prompt copied')}catch(e){prompt('Copy prompt:',t)}};
resize();
</script></html>
